name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  templates:
    # Scaffold every template with live crates.io versions, then build and test the result.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [counter, erc20, vault]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: cargo-stylus
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-stylus
      - run: node bin/create-stylus-latest.js "${{ runner.temp }}/app" -t ${{ matrix.template }} -y --no-git
      - run: cargo test --lib
        working-directory: ${{ runner.temp }}/app
      - run: cargo build --release --target wasm32-unknown-unknown --lib
        working-directory: ${{ runner.temp }}/app
      # Real on-chain validation: catches missing Stylus.toml, size limits and activation errors.
      - run: cargo stylus check --endpoint https://sepolia-rollup.arbitrum.io/rpc
        working-directory: ${{ runner.temp }}/app
