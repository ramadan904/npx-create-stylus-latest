name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, with no code change: every template is scaffolded against the newest stylus-sdk and alloy on crates.io and
  # built, tested and deployed, so a release that breaks "always latest" turns this red within a week.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  web:
    # The playground page: its generated selector table is current, and it works in a real browser (no script errors,
    # phone layout, calldata identical to viem's, contract errors decoded into sentences).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: e2e
      - run: node gen-web-abi.mjs --check
        working-directory: e2e
      - run: node web-check.mjs
        working-directory: e2e

  networks:
    # The network table behind --network and --usdg, checked against the chains: each RPC's chain id, and that each
    # Paxos USDG address holds a contract reporting symbol USDG and 6 decimals.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: e2e
      - run: node verify-networks.mjs
        working-directory: e2e

  package:
    # The package as npm would ship it: pack the tarball, run it with npx in an empty directory, scaffold every template.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/smoke-pack.sh

  probe:
    # Informational: what `doctor` reports for the public Arbitrum Sepolia endpoint (never a gate; the dev-node probe
    # in the e2e job is the one that gates).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/create-stylus-latest.js doctor --offline --rpc https://sepolia-rollup.arbitrum.io/rpc || true

  e2e-flows:
    # Real money flows on a local Nitro dev node: deploy the erc20 template as the token and the stream and escrow
    # templates against it, then move real tokens through approve / transferFrom / transfer and check exact balances.
    # The templates' unit tests mock the token; this is the only place the real cross-contract calls run.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache/restore@v4
        id: cargo-stylus
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-stylus
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - run: npm install
        working-directory: e2e
      - name: Create a throwaway key
        working-directory: e2e
        run: |
          key=0x$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$key"
          addr=$(node --input-type=module -e 'import { privateKeyToAddress } from "viem/accounts"; process.stdout.write(privateKeyToAddress(process.argv[1]))' "$key")
          echo "E2E_KEY=$key" >> "$GITHUB_ENV"
          echo "E2E_ADDR=$addr" >> "$GITHUB_ENV"
      - name: Start a dev node that funds that key
        run: |
          mkdir -p "${{ runner.temp }}/node-app"
          node bin/create-stylus-latest.js "${{ runner.temp }}/node-app" -t counter -y --no-git
          # The generated devnode.sh prepares the node itself (installs the StylusDeployer, funds the chain owner from
          # PRIVATE_KEY): this exercises the shipped script, on the harder path where FUND_ADDRESS leaves the owner unfunded.
          cd "${{ runner.temp }}/node-app" && FUND_ADDRESS="$E2E_ADDR" PRIVATE_KEY="$E2E_KEY" ./scripts/devnode.sh
      - name: Deploy the token, the stream contract and the escrow
        run: |
          deploy() {  # deploy <template> <constructor args...>; prints the address
            local name="$1"; shift
            local dir="${{ runner.temp }}/app-$name"
            local flags=()
            # the agent templates also get their client, with the AI-agent interface that e2e/agent.mjs and mcp-check.mjs drive
            if [ "${WITH_CLIENT:-}" = 1 ]; then flags+=(--with-client); fi
            node bin/create-stylus-latest.js "$dir" -t "$name" -y --no-git ${flags[@]+"${flags[@]}"} >&2
            if [ "${WITH_CLIENT:-}" = 1 ]; then (cd "$dir/client" && npm install --silent --no-audit --no-fund >&2); fi
            printf 'RPC_URL=http://127.0.0.1:8547\nCHAIN_ID=412346\nPRIVATE_KEY=%s\n' "$E2E_KEY" > "$dir/.env"
            # DOTENV_TOKEN: put the token in .env as TOKEN_ADDRESS, the way --usdg does, for an env:TOKEN_ADDRESS argument
            if [ -n "${DOTENV_TOKEN:-}" ]; then echo "TOKEN_ADDRESS=$DOTENV_TOKEN" >> "$dir/.env"; fi
            (cd "$dir" && if [ $# -gt 0 ]; then ./scripts/deploy.sh -- "$@"; else ./scripts/deploy.sh; fi > deploy.log 2>&1) || { sed 's/\x1b\[[0-9;]*m//g' "$dir/deploy.log" | tail -30 >&2; return 1; }
            sed 's/\x1b\[[0-9;]*m//g' "$dir/deploy.log" | grep -iE 'deployed code at address' | grep -oE '0x[0-9a-fA-F]{40}' | head -1
          }
          token=$(WITH_CLIENT=1 deploy erc20 "Test Token" TST 1000000000000000000000000 "$E2E_ADDR")
          test -n "$token" || { echo "token deploy failed"; exit 1; }
          stream=$(WITH_CLIENT=1 DOTENV_TOKEN="$token" deploy stream env:TOKEN_ADDRESS)   # the token comes from .env
          test -n "$stream" || { echo "stream deploy failed"; exit 1; }
          escrow=$(WITH_CLIENT=1 deploy escrow "$token")
          test -n "$escrow" || { echo "escrow deploy failed"; exit 1; }
          vault=$(WITH_CLIENT=1 deploy vault "$token")
          test -n "$vault" || { echo "vault deploy failed"; exit 1; }
          echo "VAULT=$vault" >> "$GITHUB_ENV"
          echo "VAULT_DIR=${{ runner.temp }}/app-vault" >> "$GITHUB_ENV"
          counter=$(WITH_CLIENT=1 deploy counter)
          test -n "$counter" || { echo "counter deploy failed"; exit 1; }
          mathlib=$(WITH_CLIENT=1 deploy interop)
          test -n "$mathlib" || { echo "interop deploy failed"; exit 1; }
          { echo "COUNTER=$counter"; echo "COUNTER_DIR=${{ runner.temp }}/app-counter"; echo "MATHLIB=$mathlib"; echo "MATHLIB_DIR=${{ runner.temp }}/app-interop"; } >> "$GITHUB_ENV"
          nft=$(WITH_CLIENT=1 deploy erc721 "Test Badges" TBDG ipfs://cid/ "$E2E_ADDR")   # the agent's key is the minter
          test -n "$nft" || { echo "nft deploy failed"; exit 1; }
          echo "NFT=$nft" >> "$GITHUB_ENV"
          echo "NFT_DIR=${{ runner.temp }}/app-erc721" >> "$GITHUB_ENV"
          # The dev node has no Chainlink feeds: a mock one (e2e/mock-feed.mjs) at 3000 with 8 decimals, like ETH / USD
          (cd e2e && npm install --silent --no-audit --no-fund)
          feed=$(cd e2e && E2E_KEY="$E2E_KEY" node mock-feed.mjs 8 300000000000)
          test -n "$feed" || { echo "mock feed deploy failed"; exit 1; }
          oracle=$(WITH_CLIENT=1 deploy oracle "$feed" 8 3600)   # prices older than an hour are refused
          test -n "$oracle" || { echo "oracle deploy failed"; exit 1; }
          echo "FEED=$feed" >> "$GITHUB_ENV"
          echo "ORACLE=$oracle" >> "$GITHUB_ENV"
          echo "ORACLE_DIR=${{ runner.temp }}/app-oracle" >> "$GITHUB_ENV"
          faucet=$(WITH_CLIENT=1 deploy faucet "$token" 100 30)   # 100 base units per drip, 30 s cooldown
          test -n "$faucet" || { echo "faucet deploy failed"; exit 1; }
          echo "FAUCET=$faucet" >> "$GITHUB_ENV"
          echo "FAUCET_DIR=${{ runner.temp }}/app-faucet" >> "$GITHUB_ENV"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          echo "TOKEN_DIR=${{ runner.temp }}/app-erc20" >> "$GITHUB_ENV"
          echo "STREAM=$stream" >> "$GITHUB_ENV"
          echo "ESCROW=$escrow" >> "$GITHUB_ENV"
          echo "STREAM_DIR=${{ runner.temp }}/app-stream" >> "$GITHUB_ENV"
          echo "ESCROW_DIR=${{ runner.temp }}/app-escrow" >> "$GITHUB_ENV"
          echo "token $token, stream $stream, escrow $escrow"
      - name: Run the flows
        working-directory: e2e
        env:
          RPC_URL: http://127.0.0.1:8547
          CHAIN_ID: "412346"
        run: node flows.mjs
      # The same contracts, driven the way an AI agent would: JSON intents through the generated agent CLI.
      - name: Run the agent intents
        working-directory: e2e
        env:
          RPC_URL: http://127.0.0.1:8547
          CHAIN_ID: "412346"
        shell: bash
        run: node agent.mjs
      # The same tools served over MCP (client/src/agent-mcp.ts), driven by the official MCP SDK client the way Claude
      # Desktop or Claude Code would launch it: open, read and cancel a real stream, a spending limit, errors by name.
      - name: Use the contracts through the MCP server
        working-directory: e2e
        env:
          RPC_URL: http://127.0.0.1:8547
          CHAIN_ID: "412346"
        run: node mcp-check.mjs
      - if: failure()
        run: docker logs --tail 80 stylus-devnode || true

  templates:
    # Scaffold every template with live crates.io versions, then build, test and
    # validate the result against a local Nitro dev node.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [counter, erc20, erc721, vault, escrow, stream, oracle, interop, faucet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache/restore@v4
        id: cargo-stylus
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-stylus
      # Save right after installing so a later failure does not throw away the 4-minute build.
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - run: node bin/create-stylus-latest.js "${{ runner.temp }}/app" -t ${{ matrix.template }} -y --no-git --with-client
      - run: npm install && npm run typecheck
        working-directory: ${{ runner.temp }}/app/client
      # The generated project pins Rust 1.91.0 (for cargo-stylus), so lint with the stable toolchain.
      - run: cargo +stable fmt --check
        working-directory: ${{ runner.temp }}/app
      - run: cargo +stable clippy --all-targets -- -D warnings
        working-directory: ${{ runner.temp }}/app
      - run: cargo test --lib
        working-directory: ${{ runner.temp }}/app
      - run: cargo build --release --target wasm32-unknown-unknown --lib
        working-directory: ${{ runner.temp }}/app
      # A random deploy key in .env: devnode.sh funds it and installs the StylusDeployer, like it does for a user.
      - name: Start a dev node (the generated script prepares it)
        working-directory: ${{ runner.temp }}/app
        run: |
          echo "PRIVATE_KEY=0x$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')" > .env
          ./scripts/devnode.sh
      # Catches missing Stylus.toml, size limits and activation errors. Stylus refuses more than 24,576 bytes
      # compressed, and a build's size drifts as dependencies release, so fail at a 23,000-byte budget instead:
      # a template that creeps up is caught here, with room to fix it, before it fails for users.
      - name: Check the contract against the dev node, with a size budget
        working-directory: ${{ runner.temp }}/app
        env:
          RPC_URL: http://127.0.0.1:8547
        run: |
          set -o pipefail
          ./scripts/deploy.sh --check-only 2>&1 | tee check.log
          bytes="$(sed 's/\x1b\[[0-9;]*m//g' check.log | grep -oE 'contract size: [0-9.]+ KB \(([0-9]+) bytes\)' | grep -oE '[0-9]+ bytes' | head -1 | cut -d' ' -f1)"
          [ -n "$bytes" ] || { echo "::error::could not read the contract size"; exit 1; }
          echo "${{ matrix.template }}: ${bytes} bytes compressed (limit 24576, budget 23000)"
          [ "$bytes" -le 23000 ] || { echo "::error::${{ matrix.template }} is ${bytes} bytes, over the 23,000-byte budget (Stylus limit 24,576). Shrink it before it stops deploying."; exit 1; }
      # And a real deploy, constructor included, so the local dev node flow in the README actually works.
      - name: Deploy to the dev node
        working-directory: ${{ runner.temp }}/app
        env:
          RPC_URL: http://127.0.0.1:8547
        run: |
          case "${{ matrix.template }}" in
            counter|interop) args=() ;;
            erc20) args=("Test Token" TST 1000 0x1111111111111111111111111111111111111111) ;;
            erc721) args=("Test Badges" TBDG ipfs://cid/ 0x1111111111111111111111111111111111111111) ;;  # name, symbol, base URI, minter
            faucet) args=(0x1111111111111111111111111111111111111111 100 60) ;;  # token, amount per drip, cooldown
            oracle) args=(0x1111111111111111111111111111111111111111 8 90000) ;;  # feed, its decimals, max age (s)
            *) args=(0x1111111111111111111111111111111111111111) ;;  # vault, escrow, stream: any non-zero token address
          esac
          set -o pipefail
          if [ ${#args[@]} -gt 0 ]; then ./scripts/deploy.sh -- "${args[@]}"; else ./scripts/deploy.sh; fi | tee deploy.log
      # interop: compile solidity/Consumer.sol, deploy it against the Rust contract just deployed, and check the answers
      # and the errors crossing between the two languages on the dev node.
      - name: Solidity calls the Rust contract
        if: matrix.template == 'interop'
        working-directory: ${{ runner.temp }}/app
        env:
          RPC_URL: http://127.0.0.1:8547
          CHAIN_ID: "412346"
        run: |
          CONTRACT_ADDRESS="$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -i 'deployed code at address' | grep -oE '0x[0-9a-fA-F]{40}' | head -1)"
          [ -n "$CONTRACT_ADDRESS" ] || { echo "::error::no deployed address in deploy.log"; exit 1; }
          CONTRACT_ADDRESS="$CONTRACT_ADDRESS" ./scripts/interop.sh
      - if: failure()
        run: docker logs --tail 60 stylus-devnode || true

  verify:
    # Reproducible deploys: VERIFY=1 deploy.sh builds inside cargo-stylus's pinned Docker image, verify.sh rebuilds the
    # source and proves it matches the deployed code, and a one-line change to the source must then fail verification.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ github.workspace }}/../verify-app
      RPC_URL: http://127.0.0.1:8547
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache/restore@v4
        id: cargo-stylus
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-stylus
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - run: node bin/create-stylus-latest.js "$APP" -t counter -y --no-git
      - name: Start a dev node that funds a throwaway key
        working-directory: ${{ env.APP }}
        run: |
          echo "PRIVATE_KEY=0x$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')" > .env
          ./scripts/devnode.sh
      - name: Reproducible deploy (VERIFY=1)
        working-directory: ${{ env.APP }}
        run: |
          set -o pipefail
          VERIFY=1 ./scripts/deploy.sh | tee deploy.log
          [ ! -e .stylus-deploy-key ] || { echo "::error::the key file was left in the project"; exit 1; }
          tx="$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -oE 'verify.sh 0x[0-9a-fA-F]{64}' | cut -d' ' -f2)"
          [ -n "$tx" ] || { echo "::error::deploy.sh printed no verify command"; exit 1; }
          echo "DEPLOY_TX=$tx" >> "$GITHUB_ENV"
      - name: verify.sh proves the deployed code is this source
        working-directory: ${{ env.APP }}
        run: ./scripts/verify.sh "$DEPLOY_TX"
      - name: verify.sh rejects a one-line change to the source
        working-directory: ${{ env.APP }}
        run: |
          sed -i '0,/self.number.set(new_number);/s//self.number.set(new_number + U256::from(1));/' src/lib.rs
          grep -q 'new_number + U256::from(1)' src/lib.rs || { echo "::error::the source change did not apply"; exit 1; }
          if ./scripts/verify.sh "$DEPLOY_TX"; then
            echo "::error::verify.sh accepted source that differs from the deployed code"
            exit 1
          fi
          echo "verify.sh refused the changed source, as it must."
      - if: failure()
        run: docker logs --tail 60 stylus-devnode || true

  e2e:
    # Full flow on a local Nitro dev node: deploy the counter with a throwaway key, then call it
    # through the generated TypeScript client and check that the state actually changed.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ github.workspace }}/../e2e-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache/restore@v4
        id: cargo-stylus
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-stylus
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - run: node bin/create-stylus-latest.js "$APP" -t counter -y --no-git --with-client --with-ui
      - run: npm install
        working-directory: ${{ env.APP }}/client
      - name: Create a throwaway key
        working-directory: ${{ env.APP }}/client
        run: |
          key=0x$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$key"
          addr=$(node --input-type=module -e 'import { privateKeyToAddress } from "viem/accounts"; process.stdout.write(privateKeyToAddress(process.argv[1]))' "$key")
          echo "E2E_KEY=$key" >> "$GITHUB_ENV"
          echo "E2E_ADDR=$addr" >> "$GITHUB_ENV"
          echo "Funding $addr"
      - name: Start a dev node that funds that key
        working-directory: ${{ env.APP }}
        run: FUND_ADDRESS="$E2E_ADDR" ./scripts/devnode.sh
      - name: Doctor accepts the dev node and the public Arbitrum Sepolia endpoint
        run: |
          node bin/create-stylus-latest.js doctor --rpc http://127.0.0.1:8547
          # Informational: shows what the heuristic reports for a public endpoint; not a gate.
          node bin/create-stylus-latest.js doctor --rpc https://sepolia-rollup.arbitrum.io/rpc > public-probe.txt 2>&1 || true
          cat public-probe.txt
          echo "::notice title=doctor vs public Arbitrum Sepolia RPC::$(tr '\n' '|' < public-probe.txt)"
      - name: Deploy
        working-directory: ${{ env.APP }}
        run: |
          printf 'RPC_URL=http://127.0.0.1:8547\nCHAIN_ID=412346\nPRIVATE_KEY=%s\n' "$E2E_KEY" > .env
          ./scripts/deploy.sh 2>&1 | tee deploy.log
          addr=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -iE 'deployed code at address' | grep -oE '0x[0-9a-fA-F]{40}' | head -1)
          test -n "$addr" || { echo "Could not find the deployed address in the output above"; exit 1; }
          echo "CONTRACT_ADDRESS=$addr" >> .env
          echo "Deployed to $addr"
      - name: Call the contract through the generated client
        working-directory: ${{ env.APP }}/client
        run: |
          npm start | tee out.txt
          grep -q 'number: 0n' out.txt
          grep -q 'number: 1n' out.txt
      # The page --with-ui generates, in a real browser: lists the functions, reads, signs with the dev node key, writes.
      - name: Use the contract through the generated web page
        run: |
          (cd "$APP" && ./scripts/ui.sh 5173 > ui.log 2>&1 &)
          for _ in $(seq 1 120); do curl -sf http://127.0.0.1:5173/config.json > /dev/null && break; sleep 2; done
          cd e2e && npm install --silent --no-audit --no-fund && node ui-check.mjs || { cat "$APP/ui.log"; exit 1; }
      - if: failure()
        run: docker logs --tail 80 stylus-devnode || true
