name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  templates:
    # Scaffold every template with live crates.io versions, then build and test the result.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [counter, erc20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: node bin/create-stylus-latest.js "${{ runner.temp }}/app" -t ${{ matrix.template }} -y --no-git
      - run: cargo test --lib
        working-directory: ${{ runner.temp }}/app
      - run: cargo build --release --target wasm32-unknown-unknown --lib
        working-directory: ${{ runner.temp }}/app
