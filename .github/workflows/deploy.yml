name: Deploy to Arbitrum Sepolia

# Manual only. Needs a repository secret DEPLOYER_PRIVATE_KEY holding a funded THROWAWAY testnet key.
# Optional secret RPC_URL (e.g. a provider endpoint) overrides the rpc_url input below; see the README
# note about public RPCs rejecting the activation check.
on:
  workflow_dispatch:
    inputs:
      template:
        description: Template to scaffold and deploy
        type: choice
        options: [counter, erc20, vault]
        default: counter
      rpc_url:
        description: RPC endpoint (ignored if the RPC_URL secret is set)
        default: https://sepolia-rollup.arbitrum.io/rpc
      chain_id:
        description: Chain id of that endpoint (421614 = Arbitrum Sepolia)
        default: "421614"
      max_fee_gwei:
        description: Gas price cap in gwei (you pay the actual base fee, not the cap)
        default: "0.5"
      constructor_args:
        description: 'Constructor arguments, shell-quoted. {{deployer}} becomes the address of the deploy key. erc20: "Buildathon Token" BUIDL 1000000000000000000000000 {{deployer}}  vault: <token address>'
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ github.workspace }}/../deploy-app
      RPC_URL: ${{ secrets.RPC_URL || inputs.rpc_url }}
      CHAIN_ID: ${{ inputs.chain_id }}
      MAX_FEE_GWEI: ${{ inputs.max_fee_gwei }}
      PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - name: Require the deployer secret
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Add a repository secret named DEPLOYER_PRIVATE_KEY (a funded throwaway testnet key) and run again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        id: cargo-stylus
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-stylus
      - if: steps.cargo-stylus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ runner.os }}-v1
      - run: node bin/create-stylus-latest.js "$APP" -t "${{ inputs.template }}" -y --no-git --with-client
      - name: Install client dependencies
        working-directory: ${{ env.APP }}/client
        run: npm install --silent
      - name: Deploy
        working-directory: ${{ env.APP }}
        env:
          CONSTRUCTOR_ARGS: ${{ inputs.constructor_args }}
        run: |
          printf 'RPC_URL=%s\nCHAIN_ID=%s\nPRIVATE_KEY=%s\n' "$RPC_URL" "$CHAIN_ID" "$PRIVATE_KEY" > .env
          key="$PRIVATE_KEY"; case "$key" in 0x*) ;; *) key="0x$key" ;; esac
          deployer=$(cd client && node --input-type=module -e 'import { privateKeyToAddress } from "viem/accounts"; process.stdout.write(privateKeyToAddress(process.argv[1]))' "$key")
          echo "Deploying from $deployer"
          args_text="${CONSTRUCTOR_ARGS//\{\{deployer\}\}/$deployer}"
          ctor=()
          if [ -n "$args_text" ]; then
            mapfile -d '' -t ctor < <(python3 -c 'import shlex,sys; sys.stdout.write("\0".join(shlex.split(sys.argv[1])) + "\0")' "$args_text")
          fi
          if [ ${#ctor[@]} -gt 0 ]; then
            ./scripts/deploy.sh -- "${ctor[@]}" 2>&1 | tee deploy.log
          else
            ./scripts/deploy.sh 2>&1 | tee deploy.log
          fi
          addr=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -iE 'deployed code at address' | grep -oE '0x[0-9a-fA-F]{40}' | head -1)
          test -n "$addr" || { echo "::error::Could not find the deployed address in the output above"; exit 1; }
          echo "CONTRACT_ADDRESS=$addr" >> .env
          {
            echo "## Deployed \`${{ inputs.template }}\`"
            echo ""
            echo "- Address: \`$addr\`"
            echo "- Chain id: $CHAIN_ID"
            if [ "$CHAIN_ID" = "421614" ]; then echo "- Explorer: https://sepolia.arbiscan.io/address/$addr"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read it back through the generated client
        working-directory: ${{ env.APP }}/client
        run: npm start
