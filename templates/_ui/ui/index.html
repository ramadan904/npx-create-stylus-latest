<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract UI</title>
<style>
  :root { --bg: #0d1117; --panel: #151b24; --line: #263040; --text: #e6edf3; --muted: #8b98a9; --accent: #3fa2ff;
    --ok: #3ddc97; --warn: #f0b429; --code: #0a0e14; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fb; --panel: #fff; --line: #dbe2ec; --text: #14202e; --muted: #5b6b80; --accent: #0b6fd6;
      --ok: #138a5c; --warn: #9a6b00; --code: #eef2f7; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 26px 0 10px; }
  .meta { color: var(--muted); font-size: 13.5px; word-break: break-all; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 0; }
  button { font: inherit; font-size: 14px; cursor: pointer; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: wait; }
  .fn button { margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; }
  .fn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .fn h3 { margin: 0 0 2px; font: 600 15px ui-monospace, Menlo, Consolas, monospace; }
  .sig { color: var(--muted); font: 12px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; margin-bottom: 8px; }
  label { display: block; color: var(--muted); font-size: 12.5px; margin: 6px 0 2px; }
  input { width: 100%; font: 13.5px ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: var(--code);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
  .out { margin-top: 8px; font: 12.5px ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; min-height: 1em; }
  .out.ok { color: var(--ok); } .out.bad { color: var(--warn); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .notice { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--warn); border-radius: 10px; color: var(--warn); font-size: 13.5px; }
  .notice:empty { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Contract</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="bar">
    <button id="connect">Connect browser wallet</button>
    <button id="devkey" hidden>Use the dev node key</button>
    <span class="pill" id="who">read-only</span>
    <button id="refresh">Read all again</button>
  </div>
  <div class="notice" id="notice"></div>
  <h2>Read</h2>
  <div class="grid" id="reads"></div>
  <h2>Write</h2>
  <div class="grid" id="writes"></div>
</div>
<script type="module">
// Generated by create-stylus-latest (--with-ui). Everything comes from the contract's exported interface (abi.sol) and
// .env (/config.json); edit freely. Library: viem, loaded from esm.sh.
import { BaseError, createPublicClient, createWalletClient, custom, defineChain, http, isAddress, parseAbi, parseEventLogs, parseEther } from "https://esm.sh/viem@2.57.2";
import { privateKeyToAccount } from "https://esm.sh/viem@2.57.2/accounts";

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, text) => Object.assign(document.createElement(tag), props, text === undefined ? {} : { textContent: text });
const json = (v) => JSON.stringify(v, (_k, x) => (typeof x === "bigint" ? x.toString() : x), 2);
// A single number or string as is; lists and tuples as JSON.
const display = (v) => (typeof v === "bigint" || typeof v === "number" || typeof v === "boolean" ? String(v) : typeof v === "string" ? v : json(v));

/** The Solidity interface from `cargo stylus export-abi`, turned into a viem ABI. */
function solToAbi(text) {
  const name = /interface\s+(\w+)/.exec(text)?.[1]?.replace(/^I(?=[A-Z])/, "") ?? "Contract";
  const items = [...text.matchAll(/^\s*(?:function|event|error)\s[^;]*;/gm)].map((m) =>
    m[0].trim().replace(/;$/, "").replace(/\b(external|public|memory|calldata|storage|virtual|override)\b/g, "")
      .replace(/\s+/g, " ").replace(/\(\s+/g, "(").replace(/\s+\)/g, ")").replace(/\s+,/g, ",").trim());
  return { name, abi: parseAbi(items) };
}

/** Text from an input box, as the ABI type expects it. */
function parseArg(type, raw) {
  const text = raw.trim();
  if (type.endsWith("]") || type.startsWith("tuple")) return JSON.parse(text);
  if (/^u?int\d*$/.test(type)) {
    if (!/^-?\d+$/.test(text)) throw new Error(`${type}: a whole number, e.g. 42`);
    return BigInt(text);
  }
  if (type === "bool") {
    if (!/^(true|false)$/i.test(text)) throw new Error("bool: true or false");
    return /^true$/i.test(text);
  }
  if (type === "address" && !isAddress(text)) throw new Error("address: 0x followed by 40 hex characters");
  if (/^bytes\d*$/.test(type) && !/^0x([0-9a-fA-F]{2})*$/.test(text)) throw new Error(`${type}: hex, e.g. 0x1234`);
  return text;
}

/** A revert, by the contract's own error name and arguments when the ABI knows it. */
function explain(err) {
  if (err instanceof BaseError) {
    const reverted = err.walk((e) => e?.name === "ContractFunctionRevertedError");
    if (reverted?.data?.errorName) return `${reverted.data.errorName}(${(reverted.data.args ?? []).map((a) => json(a)).join(", ")})`;
    return err.shortMessage;
  }
  return err?.message ?? String(err);
}

const config = await (await fetch("config.json")).json();
const { name, abi } = solToAbi(await (await fetch("abi.sol")).text());
document.title = `${name} · Contract UI`;
$("title").textContent = name;
const chain = defineChain({ id: config.chainId, name: `chain ${config.chainId}`, nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: { default: { http: [config.rpc] } } });
const pub = createPublicClient({ chain, transport: http(config.rpc) });
const address = config.address;
let wallet = null;
let account = null;

$("meta").textContent = address ? `${address} · chain ${config.chainId} · ${config.rpc}` : `chain ${config.chainId} · ${config.rpc}`;
if (!isAddress(address || "")) $("notice").textContent = "Set CONTRACT_ADDRESS in .env to your deployed contract, then reload.";

const reads = abi.filter((f) => f.type === "function" && (f.stateMutability === "view" || f.stateMutability === "pure"));
const writes = abi.filter((f) => f.type === "function" && !reads.includes(f));
const autoReads = [];

function card(f, write) {
  const box = el("div", { className: "fn" });
  box.dataset.fn = f.name;
  box.append(el("h3", {}, f.name), el("div", { className: "sig" }, `(${f.inputs.map((i) => `${i.type} ${i.name || ""}`.trim()).join(", ")})${f.outputs?.length ? ` → (${f.outputs.map((o) => o.type).join(", ")})` : ""}`));
  const fields = f.inputs.map((input, i) => {
    const field = el("input", { placeholder: input.type, spellcheck: false, autocomplete: "off" });
    field.dataset.arg = String(i);
    box.append(el("label", {}, `${input.name || `arg${i}`} (${input.type})`), field);
    return field;
  });
  let valueField = null;
  if (f.stateMutability === "payable") {
    valueField = el("input", { placeholder: "0.0", value: "0" });
    box.append(el("label", {}, "ETH to send"), valueField);
  }
  const button = el("button", { className: write ? "primary" : "" }, write ? "Send" : "Read");
  const out = el("div", { className: "out" });
  box.append(button, out);
  const show = (text, kind = "") => { out.className = `out ${kind}`; out.textContent = text; };

  async function go() {
    button.disabled = true;
    try {
      const args = f.inputs.map((input, i) => parseArg(input.type, fields[i].value));
      if (!write) {
        const result = await pub.readContract({ address, abi, functionName: f.name, args });
        show(display(result), "ok");
        return;
      }
      if (!wallet) throw new Error("Connect a wallet first (or use the dev node key).");
      show("Simulating…");
      const value = valueField ? parseEther(valueField.value || "0") : undefined;
      const { request } = await pub.simulateContract({ address, abi, functionName: f.name, args, account, value });
      show("Sending…");
      const hash = await wallet.writeContract(request);
      const receipt = await pub.waitForTransactionReceipt({ hash });
      if (receipt.status !== "success") throw new Error(`reverted on-chain (tx ${hash})`);
      const events = parseEventLogs({ abi, logs: receipt.logs }).map((e) => `${e.eventName} ${json(e.args)}`);
      show([`confirmed in block ${receipt.blockNumber} · tx ${hash}`, ...events].join("\n"), "ok");
      refreshAll();
    } catch (err) {
      show(explain(err), "bad");
    } finally {
      button.disabled = false;
    }
  }
  button.addEventListener("click", go);
  if (!write && f.inputs.length === 0) autoReads.push(go);
  return box;
}

function refreshAll() {
  if (isAddress(address || "")) autoReads.forEach((go) => go());
}

$("reads").append(...reads.map((f) => card(f, false)));
$("writes").append(...writes.map((f) => card(f, true)));
if (!reads.length) $("reads").append(el("div", { className: "meta" }, "No read functions."));
if (!writes.length) $("writes").append(el("div", { className: "meta" }, "No write functions."));
$("refresh").addEventListener("click", refreshAll);

function signedInAs(who, label) {
  account = who;
  $("who").textContent = `${label}: ${who.address ?? who}`;
  $("who").className = "pill on";
}

// The local dev node only: sign with the throwaway key from .env, like a burner wallet. Never offered on other chains.
if (config.devKey) {
  $("devkey").hidden = false;
  $("devkey").addEventListener("click", () => {
    const signer = privateKeyToAccount(config.devKey);
    wallet = createWalletClient({ account: signer, chain, transport: http(config.rpc) });
    signedInAs(signer, "dev node key");
  });
}

$("connect").addEventListener("click", async () => {
  try {
    if (!window.ethereum) throw new Error("No browser wallet found. Install one, or use the dev node with ./scripts/devnode.sh.");
    const hex = `0x${config.chainId.toString(16)}`;
    try {
      await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
    } catch (e) {
      if (e.code !== 4902) throw e;
      await window.ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId: hex, chainName: chain.name, nativeCurrency: chain.nativeCurrency, rpcUrls: [config.rpc] }] });
    }
    const [who] = await window.ethereum.request({ method: "eth_requestAccounts" });
    wallet = createWalletClient({ account: who, chain, transport: custom(window.ethereum) });
    signedInAs(who, "wallet");
  } catch (err) {
    $("notice").textContent = explain(err);
  }
});

// Redeployed? Update CONTRACT_ADDRESS in .env and the page follows.
setInterval(async () => {
  try {
    const now = await (await fetch("config.json")).json();
    if (now.address !== config.address || now.chainId !== config.chainId || now.rpc !== config.rpc) location.reload();
  } catch {}
}, 3000);

refreshAll();
window.__ui = { abi, solToAbi, parseArg, ready: true };
</script>
</body>
</html>
